[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-benchmark"
version = "0.1.0"
description = "Heterogeneous GNN modeling of MLPerf inference results"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "torch>=2.4",
  "torch-geometric>=2.6",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.2"]
dev = ["pytest>=8.0"]

[project.scripts]
ai-benchmark-prepare = "ai_benchmark.prepare_data:main"
ai-benchmark-train = "ai_benchmark.train_graphsage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
